name: fork-build

# 个人 fork 的 Windows 资产构建与草稿 Release，参考 agent2api A2API 的
# fork-build.yml：只构建 Windows-x64 安装包，工作流仅手动触发，不响应标签
# 推送。Release 固定按应用版本创建为草稿，人工确认后再正式发布；已发布过
# 的版本重跑时标题自动追加 -r{run_number} 后缀。

on:
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只允许一个构建写草稿，避免并发派发互相覆盖。
concurrency:
  group: fork-build
  cancel-in-progress: false

jobs:
  prepare:
    name: 构建前校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      title: ${{ steps.title.outputs.value }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 读取应用版本
        id: release
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          if [[ -z "$version" ]]; then
            echo "::error::未能读取 desktop/package.json 的版本号"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 读取已发布版本
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.release.outputs.version }}"
          echo "current=$(gh release view "$tag" --json isDraft --jq '.isDraft == false' 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"

      - name: 计算发布标题
        id: title
        env:
          CURRENT_PUBLISHED: ${{ steps.published.outputs.current }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          title="v$VERSION"
          if [[ "$CURRENT_PUBLISHED" == "true" ]]; then
            title="${title}-r${RUN_NUMBER}"
          fi
          echo "value=$title" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows-x64 安装包
    runs-on: windows-latest
    timeout-minutes: 90
    needs: prepare
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 预取 native Computer Use 依赖
        # build-windows-x64.ps1 以 --offline 构建 Rust 依赖，先联网预热缓存。
        run: cargo +stable fetch --locked --manifest-path native/agent-desktop/Cargo.toml --target x86_64-pc-windows-msvc

      - name: 安装 adapters 依赖
        # IM 平台 sidecar（telegram、whatsapp 等）随桌面端一起编译，依赖在
        # adapters 子项目里，官方发布工作流同样单独安装。
        working-directory: adapters
        run: bun install

      - name: 准备捆绑的 ripgrep
        working-directory: desktop
        env:
          SIDECAR_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: bun run prepare:ripgrep

      - name: 构建 Windows-x64 安装包
        working-directory: desktop
        run: bun run build:windows-x64

      - name: 收集发布资产
        shell: pwsh
        run: |
          $canonical = "desktop/build-artifacts/windows-x64"
          $stage = "dist"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $canonical "Claude-Code-Haha-*-Windows-x64-Setup.exe") $stage/
          Copy-Item (Join-Path $canonical "Claude-Code-Haha-*-Windows-x64-Setup.exe.blockmap") $stage/
          Copy-Item (Join-Path $canonical "latest.yml") $stage/
          Get-ChildItem $stage | Format-Table Name, Length

      - name: 上传发布资产
        uses: actions/upload-artifact@v7
        with:
          name: fork-windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: 创建草稿 Release
    needs:
      - prepare
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 准备发布说明
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TITLE: ${{ needs.prepare.outputs.title }}
        run: |
          set -euo pipefail
          # 与参考项目 A2API 相同，变更文档就是累积载体：同版本的历轮改动
          # 在文档里整合或追加，工作流整体取用「本轮改动详情」与「历史轮次」
          # 两节，不拼接旧 Release 正文，避免同一轮内容重复；升级版本时把
          # 上一版本的轮次从「历史轮次」清掉，正文即重新开始。官方更新记录
          # 以链接引用，不复制正文。
          fork_doc="$(ls FORK_*.md 2>/dev/null | sort | tail -n1 || true)"
          if [[ -z "$fork_doc" ]]; then
            echo "::error::未找到 FORK_*.md 变更文档"
            exit 1
          fi
          round_date="$(sed -n 's/^## 本轮改动详情（\(.*\)）$/\1/p' "$fork_doc" | head -n1)"
          # 用 awk 取两节正文，避免该节是文件末节时 sed 的结束地址误删末行。
          round="$(awk '/^## 本轮改动详情/{found=1; next} /^## /{if(found) exit} found{print}' "$fork_doc" | sed 's/^### /#### /')"
          history="$(awk '/^## 历史轮次/{found=1; next} /^## /{if(found) exit} found{print}' "$fork_doc")"
          if [[ -z "${round//[[:space:]]/}" ]]; then
            echo "::error::变更文档的「本轮改动详情」为空，请先补充本轮改动"
            exit 1
          fi
          {
            echo "## Claude Code Haha ${TITLE}（fork 构建）"
            echo
            echo "基于官方 v${VERSION} 的 fork 定制构建，官方更新记录见 [NanmiCoder/cc-haha v${VERSION}](https://github.com/NanmiCoder/cc-haha/releases/tag/v${VERSION})。"
            echo
            echo "### fork 定制内容"
            echo
            echo "### ${round_date:-本轮改动}"
            echo
            echo "$round"
            if [[ -n "${history//[[:space:]]/}" ]]; then
              echo
              echo "$history"
            fi
          } > body.md


      - name: 下载发布资产
        uses: actions/download-artifact@v7
        with:
          name: fork-windows-x64
          path: dist

      - name: 校验 Release 附件
        run: |
          set -euo pipefail
          cd dist
          setup_count="$(find . -maxdepth 1 -type f -name '*-Setup.exe' | wc -l)"
          blockmap_count="$(find . -maxdepth 1 -type f -name '*.blockmap' | wc -l)"
          metadata_count="$(find . -maxdepth 1 -type f -name 'latest.yml' | wc -l)"
          if [[ "$setup_count" -ne 1 || "$blockmap_count" -ne 1 || "$metadata_count" -ne 1 ]]; then
            echo "::error::Release 附件应为安装包、blockmap 与更新元数据各一个"
            find . -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

      - name: 清理同版本草稿 Release
        # release-action 按 tag 匹配旧草稿：创建时未绑定 tag 的残留草稿匹配
        # 不上，已发布版本重跑生成的 -r 后缀标题也与原草稿不同名，重跑会累积
        # 多个同版本草稿。这里按版本前缀清掉本版本的全部草稿（含 -r 后缀），
        # 只删草稿，已发布的 Release 不动。
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.draft and ((.name == $ENV.VERSION_TAG) or (.name | startswith($ENV.VERSION_TAG + "-r")))) | .id')"
          count=0
          while IFS= read -r id; do
            if [[ -n "$id" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" > /dev/null
              count=$((count + 1))
            fi
          done <<< "$ids"
          echo "已删除同名草稿 Release $count 个"

      - name: 创建或更新草稿 Release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "dist/*"
          bodyFile: body.md
          draft: true
          tag: ${{ needs.prepare.outputs.title }}
          token: ${{ secrets.GITHUB_TOKEN }}
          updateOnlyUnreleased: true
